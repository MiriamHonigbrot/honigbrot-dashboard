<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="1800">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honigbrot Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFAEB;
    --cream-deep: #FCE5BD;
    --card: #FFFFFF;
    --panel: #F1E1C5;
    --terracotta: #C66949;
    --gold: #B38952;
    --green-dark: #2A3824;
    --green: #55694D;
    --text: #2D2C2C;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Quicksand", -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
    color: var(--text);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .header img { height: 52px; }
  h1 {
    font-family: "Petit Formal Script", cursive;
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--green-dark);
    margin: 0;
  }
  .updated { color: var(--gold); font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; }
  .note {
    background: var(--terracotta);
    color: white;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(42,56,36,0.15);
  }
  .columns { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .column { flex: 1 1 340px; min-width: 0; }
  h2 {
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--green-dark);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
    margin: 0 0 12px;
  }
  .event-card, .shift-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(42,56,36,0.10);
    border-left: 4px solid var(--gold);
  }
  .event-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; flex-wrap: wrap; }
  .event-time { font-weight: 700; font-size: 1.1rem; color: var(--green-dark); }
  .event-status { color: white; font-size: 0.75rem; padding: 3px 12px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
  .event-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
  .event-detail { color: #6b5c48; font-size: 0.95rem; }
  .empty { color: #8a7a6a; font-style: italic; padding: 8px 0 16px; }

  .timeline { background: var(--card); border-radius: 14px; padding: 14px 16px 16px; box-shadow: 0 2px 6px rgba(42,56,36,0.10); overflow-x: auto; }
  .timeline-axis { position: relative; height: 22px; border-bottom: 1px solid #e8dcc6; margin-bottom: 10px; min-width: 480px; }
  .timeline-hour { position: absolute; top: 0; height: 100%; border-left: 1px solid #e8dcc6; }
  .timeline-hour-label { position: absolute; top: -2px; left: 4px; font-size: 0.7rem; color: #9a8c78; font-weight: 600; }
  .timeline-lanes { position: relative; min-width: 480px; }
  .timeline-bar {
    position: absolute;
    background: var(--green);
    border-radius: 10px;
    box-shadow: 0 0 0 2px var(--card);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    line-height: 1.15;
    padding: 2px 6px;
    overflow: hidden;
  }
  .timeline-bar-kitchen { background: var(--gold); }
  .timeline-bar-lead { background: var(--terracotta); }
  .timeline-bar-name { font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
  .timeline-bar-time { font-size: 0.68rem; opacity: 0.85; white-space: nowrap; }
  .timeline-now { position: absolute; top: 0; border-left: 2px solid var(--terracotta); z-index: 2; }
  .timeline-now-label {
    position: absolute; top: -36px; left: 4px;
    font-size: 0.68rem; font-weight: 700; color: var(--terracotta); white-space: nowrap;
  }

  @media (max-width: 640px) {
    body { padding: 14px; }
    .columns { gap: 14px; }
  }
</style>
</head>
<body>
  <div class="header">
    <img src="logo.svg" alt="Honigbrot">
    <h1>Dashboard</h1>
  </div>
  <div class="updated">Stand: 16.08.2026 08:01 Uhr</div>
  
  <div class="columns">
    <div class="column">
      <h2>Heute</h2>
      <div class="empty">Keine Termine heute.</div>
      <h2>Diese Woche</h2>
      
    <div class="event-card">
      <div class="event-header">
        <span class="event-time">Sa 22.08. 15:00–17:00</span>
        
      </div>
      <div class="event-title">Einschulungsfeier Zautke </div>
      
      
    </div>
    </div>
    <div class="column">
      <h2>Team heute</h2>
      
    <div class="timeline">
      <div class="timeline-axis"><div class="timeline-hour" style="left:0.00%"><span class="timeline-hour-label">08</span></div><div class="timeline-hour" style="left:9.09%"><span class="timeline-hour-label">09</span></div><div class="timeline-hour" style="left:18.18%"><span class="timeline-hour-label">10</span></div><div class="timeline-hour" style="left:27.27%"><span class="timeline-hour-label">11</span></div><div class="timeline-hour" style="left:36.36%"><span class="timeline-hour-label">12</span></div><div class="timeline-hour" style="left:45.45%"><span class="timeline-hour-label">13</span></div><div class="timeline-hour" style="left:54.55%"><span class="timeline-hour-label">14</span></div><div class="timeline-hour" style="left:63.64%"><span class="timeline-hour-label">15</span></div><div class="timeline-hour" style="left:72.73%"><span class="timeline-hour-label">16</span></div><div class="timeline-hour" style="left:81.82%"><span class="timeline-hour-label">17</span></div><div class="timeline-hour" style="left:90.91%"><span class="timeline-hour-label">18</span></div><div class="timeline-hour" style="left:100.00%"><span class="timeline-hour-label">19</span></div></div>
      <div class="timeline-lanes" data-axis-start="480" data-axis-end="1140" style="height:212px">
        <div class="timeline-bar " style="left:0.00%; width:63.64%; top:0px; height:36px"><span class="timeline-bar-name">Lisa</span><span class="timeline-bar-time">08:00–15:00</span></div><div class="timeline-bar " style="left:4.55%; width:77.27%; top:44px; height:36px"><span class="timeline-bar-name">Fiona</span><span class="timeline-bar-time">08:30–17:00</span></div><div class="timeline-bar " style="left:4.55%; width:68.18%; top:88px; height:36px"><span class="timeline-bar-name">Mio</span><span class="timeline-bar-time">08:30–16:00</span></div><div class="timeline-bar " style="left:9.09%; width:45.45%; top:132px; height:36px"><span class="timeline-bar-name">Hannah</span><span class="timeline-bar-time">09:00–14:00</span></div><div class="timeline-bar " style="left:13.64%; width:36.36%; top:176px; height:36px"><span class="timeline-bar-name">Lina</span><span class="timeline-bar-time">09:30–13:30</span></div><div class="timeline-bar " style="left:72.73%; width:27.27%; top:0px; height:36px"><span class="timeline-bar-name">Simon</span><span class="timeline-bar-time">16:00–19:00</span></div><div class="timeline-bar " style="left:72.73%; width:27.27%; top:88px; height:36px"><span class="timeline-bar-name">Linus</span><span class="timeline-bar-time">16:00–19:00</span></div>
        <div class="timeline-now" id="timeline-now" style="display:none; height:212px">
          <span class="timeline-now-label">jetzt</span>
        </div>
      </div>
    </div>
    <script>
    (function() {
      var container = document.currentScript.previousElementSibling;
      var lanes = container.querySelector('.timeline-lanes');
      var marker = lanes.querySelector('#timeline-now');
      var axisStart = parseInt(lanes.dataset.axisStart, 10);
      var axisEnd = parseInt(lanes.dataset.axisEnd, 10);
      function update() {
        var now = new Date();
        var minutes = now.getHours() * 60 + now.getMinutes();
        if (minutes >= axisStart && minutes <= axisEnd) {
          var pct = (minutes - axisStart) / (axisEnd - axisStart) * 100;
          marker.style.left = pct.toFixed(2) + '%';
          marker.style.display = '';
        } else {
          marker.style.display = 'none';
        }
      }
      update();
      setInterval(update, 60000);
    })();
    </script>
    </div>
  </div>
</body>
</html>
